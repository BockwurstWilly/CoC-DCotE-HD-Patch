; Call of Cthulhu: Dark Corners of the Earth - HD Patch (CoCHD.asi)
; Wird beim Spielstart gelesen / read at game start. Am einfachsten im HD Launcher einstellen.

[Display]
; auto = Aufloesung des Monitors (max. 3276 Pixel breit, darueber bricht das Inventar - dann die
; groesste Aufloesung gleichen Seitenverhaeltnisses). Sonst z.B. 2560x1440.
; auto = the monitor's resolution (max. 3276 px wide - the inventory breaks beyond that).
Resolution=auto
; fullscreen = Vollbild (randloses Fenster ueber den Monitor, Monitor auf 60 Hz), borderless = randloses
; Fenster mit Desktop-Bildrate, windowed = Fenster. Alle Alt+Tab-sicher; ein exklusiver Modus stuerzt bei Alt+Tab ab.
Mode=fullscreen
; auto = 60 Hz (bzw. 120/180/240 Hz, 60 fps ueber VSync-Intervall) - nur im Vollbildmodus
RefreshRate=auto
VSync=1
; Das Spiel ist ueber 60 fps instabil (Abstuerze, haengende Skripte): hoechstens 60.
; The game is unstable above 60 fps: 60 at most.
FPSLimit=60
; Anisotrope Texturfilterung: 0/1 = aus, 2, 4, 8, 16
Anisotropy=16
; Filmkorn des Originals (Rauschen ueber dem Bild) / the original film grain: 1 = an/on, 0 = aus/off
FilmGrain=1
; Gamma-Kurve des Spiels (Helligkeit im Spielmenue, Blitze) nachbilden - im Fenster ignoriert Windows sie
; apply the game's gamma ramp (in-game brightness, flashes) - Windows ignores it for windowed games
GameGamma=1

[Mouse]
; sens  = moderne Maussteuerung: Empfindlichkeit wie in Counter-Strike & Co. (0,022 Grad x Sens pro
;         Maus-Count), der Regler im Spiel wird ignoriert (nicht auf 0 stellen)
; off   = Original
; sens  = modern mouse: sensitivity on the Counter-Strike scale (0.022 deg x Sens per count)
Mode=sens
Sens=2.0
; Alternativ / alternatively: Mode=cm360 mit Cm360 + DPI, Mode=scale mit Scale (Faktor auf den Regler)
Cm360=30
DPI=1600
Scale=0.25
; Vertikal relativ zu horizontal / vertical relative to horizontal
YRatio=1.0
; 1 = jede Mausbewegung dreht unabhaengig von den fps gleich weit / same turn at any frame rate
FrameIndependent=1

[Pad]
; Xbox-kompatibler Controller (XInput) / Xbox compatible controller (XInput)
Enabled=1
; Kamera-Tempo bei vollem Ausschlag in Grad pro Sekunde / camera speed at full tilt, degrees per second
LookSpeed=200
; Totzone und Kurve der Sticks / stick dead zone and response curve
Deadzone=0.24
Curve=2.0
InvertY=0
; 1 = Lauftempo folgt dem Stick-Ausschlag (wie auf der Xbox) / walking speed follows the stick tilt
AnalogWalk=1
; Menue-Zeiger in Pixel pro Sekunde, 0 = automatisch / menu cursor pixels per second, 0 = automatic
CursorSpeed=0

[Debug]
; 1 = CoCHD.log in diesem Ordner schreiben
Log=0
